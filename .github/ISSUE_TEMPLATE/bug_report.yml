name: Bug report
description: Report a reproducible problem with Daryaft.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Daryaft is pre-1.0, so behavior may still change.

        Do not paste secrets, tokens, private URLs, credentials, or sensitive file paths. For security vulnerabilities, do not open a public issue; use SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daryaft version
      description: Paste `daryaft version` or `daryaft version --json` output if possible.
      placeholder: "0.5.0-dev"
    validations:
      required: true
  - type: input
    id: install_method
    attributes:
      label: Installation/build method
      placeholder: "source build, make build-local, local Go run, etc."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15, Ubuntu 24.04, etc."
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: "Terminal.app, iTerm2, GNOME Terminal, tmux, etc."
  - type: textarea
    id: command
    attributes:
      label: Command used
      render: shell
      placeholder: "daryaft https://example.com/file.zip"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs/output
      description: Redact secrets, private URLs, credentials, and sensitive paths.
      render: text
  - type: dropdown
    id: doctor_run
    attributes:
      label: Did you run `daryaft doctor`?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: doctor_json
    attributes:
      label: Optional `daryaft doctor --json` output
      description: Redact anything sensitive before pasting.
      render: json
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Press ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
